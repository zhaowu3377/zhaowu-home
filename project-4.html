<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>更多敬请期待 · zhaowu</title>
<link rel="stylesheet" href="style.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
</head>
<body>

  <header>
    <div class="wrap">
      <nav>
        <a class="brand" href="index.html">zhaowu<span class="dot">.</span></a>
        <div class="nav-right">
          <div class="nav-links">
            <a href="index.html#about">关于</a>
            <a href="index.html#work">项目</a>
            <a href="index.html#writing">文字</a>
            <a href="index.html#contact">联系</a>
          </div>
          <button class="theme-toggle" id="themeToggle" aria-label="切换深色模式" title="切换深色模式">☾</button>
        </div>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <a class="back" href="index.html">← 返回主页</a>

    <section class="project">
      <div class="num">04</div>
      <h1>更多敬请期待</h1>
      <p class="lede">这个板块还在筹备中，做出来的作品会陆续出现在这里。</p>

      <div class="meta">
        <div class="meta-item"><div class="label">状态</div><div class="value">筹备中</div></div>
        <div class="meta-item"><div class="label">年份</div><div class="value">—</div></div>
        <div class="meta-item"><div class="label">技术</div><div class="value">—</div></div>
      </div>

      <div class="prose">
        <p>这里先留个位置。等作品成型，复制一份 <code>project-3.html</code> 改名成 <code>project-5.html</code>，把首页加一张卡片指向它，就是一个新项目页了。</p>
      </div>
    </section>
  </main>

  <footer>
    <div class="wrap">
      <span>© <span id="year"></span> zhaowu</span>
      <span>用克制的方式，做点长久的东西。</span>
    </div>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
    const root = document.documentElement;
    const toggle = document.getElementById('themeToggle');
    const saved = localStorage.getItem('theme');
    if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) root.classList.add('dark');
    function syncIcon(){ toggle.textContent = root.classList.contains('dark') ? '☀' : '☾'; }
    syncIcon();
    toggle.addEventListener('click', () => { root.classList.toggle('dark'); localStorage.setItem('theme', root.classList.contains('dark') ? 'dark' : 'light'); syncIcon(); });
  </script>
  <script src="particles.js"></script>
</body>
</html>
