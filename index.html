<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>zhaowu · 个人主页</title>
<link rel="stylesheet" href="style.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
</head>
<body>

  <header>
    <div class="wrap">
      <nav>
        <a class="brand" id="brand" href="index.html">zhaowu<span class="dot">.</span></a>
        <div class="nav-right">
          <div class="nav-links" id="nav-links"></div>
          <button class="theme-toggle" id="themeToggle" aria-label="切换深色模式" title="切换深色模式">☾</button>
        </div>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="wrap">
        <span class="kicker" id="hero-kicker"></span>
        <div class="hero-title">
          <img id="hero-avatar" class="hero-avatar" alt="头像" />
          <h1 id="hero-name"></h1>
        </div>
        <p class="lede" id="hero-tagline"></p>
        <div class="scroll-hint"><span class="bar"></span> <span id="hero-scroll">向下滚动</span></div>
      </div>
    </section>

    <section id="about" class="about">
      <div class="wrap">
        <div class="sec-head"><span class="idx">01</span><h2>关于</h2></div>
        <div id="about-body"></div>
      </div>
    </section>

    <div class="wrap"><hr class="divider" /></div>

    <section id="work">
      <div class="wrap">
        <div class="sec-head"><span class="idx">02</span><h2>项目</h2></div>
        <div class="grid" id="projects"></div>
      </div>
    </section>

    <div class="wrap"><hr class="divider" /></div>

    <section id="writing">
      <div class="wrap">
        <div class="sec-head"><span class="idx">03</span><h2>文字</h2></div>
        <div class="posts" id="writing-list"></div>
      </div>
    </section>

    <div class="wrap"><hr class="divider" /></div>

    <section id="contact">
      <div class="wrap">
        <div class="sec-head"><span class="idx">04</span><h2>联系</h2></div>
        <div class="contact" id="contact-list"></div>
      </div>
    </section>
  </main>

  <footer>
    <div class="wrap">
      <span>© <span id="year"></span> zhaowu</span>
      <span>用克制的方式，做点长久的东西。</span>
    </div>
  </footer>

  <!-- 文字弹窗（毛玻璃） -->
  <div class="wmodal" id="writingModal" aria-hidden="true">
    <div class="wmodal-card" role="dialog" aria-modal="true" aria-labelledby="wmTitle">
      <button class="wmodal-close" id="wmClose" aria-label="关闭">×</button>
      <div class="wm-date" id="wmDate"></div>
      <h3 id="wmTitle"></h3>
      <div class="wm-body" id="wmBody"></div>
    </div>
  </div>

  <script src="fireworks.js"></script>
  <script src="particles.js"></script>
  <script src="frontend.js"></script>
</body>
</html>
